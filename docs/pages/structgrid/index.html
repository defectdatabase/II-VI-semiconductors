<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>structure viewer (4-pane grid)</title>
<style>html,body,#app{margin:0;width:100%;height:100%;background:#fff;overflow:hidden}</style>
  <script type="module" crossorigin src="./assets/index-CVAdGCvf-v2l.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BQYgjjCQ.css">
  <style>
    /* the 300px floor made .structure overflow narrow panels; only min-width is touched */
    .structure { min-width: 0 !important; }
    /* grid rules stay scoped to multi-view so single-view still fills the box */
    .viewport-stage.multi {
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      grid-template-rows: repeat(2, minmax(0, 1fr)) !important;
      grid-auto-rows: minmax(0, 1fr) !important;
      grid-auto-columns: minmax(0, 1fr) !important;
    }
    /* NO `.multi` on the cell: an `active` cell used to escape these and stretch its track */
    .viewport-stage.multi > .viewport-cell {
      width: auto !important; height: auto !important;
      min-width: 0 !important; min-height: 0 !important;
      max-width: 100% !important; max-height: 100% !important;
      overflow: hidden !important;
      align-self: stretch !important; justify-self: stretch !important;
    }
    .viewport-stage.multi > .viewport-cell canvas {
      display: block; width: 100% !important; height: 100% !important;
      max-width: 100% !important; max-height: 100% !important;
    }
  </style>

  <style id="wbg-tip-fix">
    /* hover tooltip must not capture the cursor: it sits at z-index 1000 under the
       pointer, so with pointer-events:auto it blocks the raycast to the atom, the hover
       is lost, the tooltip hides, the cursor is over the canvas again -> flicker loop. */
    div[style*="z-index: 1000"][style*="transform-origin"] { pointer-events: none !important; }
  </style>
</head>
<body><div id="app"></div></body>
</html>

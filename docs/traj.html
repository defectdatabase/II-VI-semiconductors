<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Continuous ionic-relaxation trajectory</title>
<style>
:root{--ink:#17252d;--muted:#62727c;--line:#d9e1e6;--blue:#2877b8;--green:#238554;--accent:#087f8c;--accent-dark:#066a75;--surface:#f7fafb;
  --page-bg:#fff !important;--pane-bg:#fff !important;--pane-color:#17252d !important}
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:var(--ink);font-family:'Arial Narrow',Arial,sans-serif}
#app{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(280px,.82fr);gap:6px;padding:6px}
.panel{min-width:0;min-height:0;border:1px solid var(--line);border-radius:7px;background:#fff;overflow:hidden}
#scene-wrap{position:relative;background:#fff;overflow:hidden}
/* MatterViz's root carries its own default height; stretch it or the cell renders letterboxed
   and off-centre inside the pane. */
.mvbuf{position:absolute;inset:0;overflow:hidden}
.mvbuf>*{width:100%!important;height:100%!important}
#analysis{display:flex;flex-direction:column;padding:4px 5px 5px;border:0}
#chart{display:block;width:100%;flex:1;min-height:190px;overflow:visible}
.controls{display:grid;grid-template-columns:auto minmax(80px,1fr) auto;align-items:center;gap:7px;margin-top:3px}
/* controls carry the tab accent, not black text */
button{font:inherit;font-weight:700;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:#fff;padding:5px 13px;cursor:pointer}
button:hover{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff}
input[type=range]{width:100%;accent-color:var(--accent)}#count{white-space:nowrap;font-size:11.5px;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
#metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:5px;border-top:1px solid var(--line)}.metric{padding:4px 6px;min-width:0}.metric+.metric{border-left:1px solid var(--line)}.metric small{display:block;color:var(--muted);font-size:10px}.metric b{display:block;margin-top:1px;font-size:12px;white-space:nowrap;color:var(--accent)}
.waiting{grid-column:1/-1;display:grid;place-items:center;color:var(--muted);font-size:13.5px}
@media(max-width:760px){#app{grid-template-columns:1fr;overflow:auto}.panel{min-height:260px}#analysis{min-height:300px}.metric b{white-space:normal}}
</style>
</head>
<body><div id="app"><div class="waiting">Loading relaxation trajectory…</div></div>
<script>
/* The 3D pane is MatterViz — the same bundle and the same pinned revision the parent page uses. */
const MV_BASE="https://cdn.jsdelivr.net/gh/defectdatabase/chalcogenide-defects@cdc59ef18b8f3707ae39a202cc7519a3eafdb9fc/matterviz";
try{ localStorage.setItem("matterviz-theme","light"); }catch(e){}
let data=null,index=0,playing=false,timer=0,duration=380,scene,chart,slider,count,playButton,chartObserver;
let mvMod=null,mvProps={show_controls:false},prepared=null,busy=false;
const finite=v=>v!==null&&v!==undefined&&Number.isFinite(+v);
const niceUpper=(value,fallback)=>{if(!(value>0))return fallback;const power=10**Math.floor(Math.log10(value)),scaled=value/power,step=scaled<=1?1:scaled<=2?2:scaled<=2.5?2.5:scaled<=5?5:10;return step*power};
const deltaText=value=>!finite(value)?'Unavailable':Math.abs(value)<.01?`${(value*1000).toFixed(2)} meV`:`${value.toFixed(2)} eV`;
const cart=(lat,f)=>[f[0]*lat[0][0]+f[1]*lat[1][0]+f[2]*lat[2][0],f[0]*lat[0][1]+f[1]*lat[1][1]+f[2]*lat[2][1],f[0]*lat[0][2]+f[1]*lat[1][2]+f[2]*lat[2][2]];
// resolves on the next paint, or on a timer when the tab is hidden and rAF is frozen
const raf=()=>new Promise(r=>{let done=false;const go=()=>{if(!done){done=true;r()}};requestAnimationFrame(go);setTimeout(go,60)});
/* ---------- MatterViz mount ---------- */
function loadMV(seed){
  if(seed) window.MV_STRUCTURE=seed;
  if(!mvMod){
    const css=document.createElement('link');css.rel='stylesheet';css.href=MV_BASE+'/mv-asset-index.css';document.head.appendChild(css);
    // The bundle's bootstrap renders window.MV_STRUCTURE into #viz, else fetches /structure.json (404).
    const hidden=document.createElement('div');hidden.id='viz';
    hidden.style.cssText='position:absolute;left:-99999px;top:0;width:240px;height:240px;overflow:hidden';
    document.body.appendChild(hidden);
    mvMod=import(MV_BASE+'/mv-app.js');
  }
  return mvMod;
}
function freeMV(el){
  el.querySelectorAll('canvas').forEach(c=>{
    const gl=c.getContext('webgl2')||c.getContext('webgl'),lose=gl&&gl.getExtension('WEBGL_lose_context');
    lose&&lose.loseContext();
  });
}
function latParams(m){
  const n=v=>Math.hypot(v[0],v[1],v[2]);
  const ang=(u,v)=>{const c=(u[0]*v[0]+u[1]*v[1]+u[2]*v[2])/(n(u)*n(v));return Math.acos(Math.max(-1,Math.min(1,c)))*180/Math.PI};
  const vol=Math.abs(m[0][0]*(m[1][1]*m[2][2]-m[1][2]*m[2][1])-m[0][1]*(m[1][0]*m[2][2]-m[1][2]*m[2][0])+m[0][2]*(m[1][0]*m[2][1]-m[1][1]*m[2][0]));
  return {a:n(m[0]),b:n(m[1]),c:n(m[2]),alpha:ang(m[1],m[2]),beta:ang(m[0],m[2]),gamma:ang(m[0],m[1]),volume:vol};
}
/* This MatterViz build has no per-site or per-element colour prop that the structure viewer honours
   (element_colors belongs to its trajectory-line component, active_sites does nothing from props),
   but site_radius_overrides does work — so the defect site is drawn oversized and every atom keeps
   its element colour. Sites are picked by defect species, exactly as the parent page picks them. */
const DEFECT_SITE_SCALE=2.6;
function defectSiteMark(payload){
  const dark=payload.dark;
  if(!dark||!Object.keys(dark).length) return {};
  const marked=new Map();
  payload.species.forEach((el,i)=>{ if(dark[el]) marked.set(i,DEFECT_SITE_SCALE) });
  return marked.size?{site_radius_overrides:marked}:{};
}
function frameStructure(k){
  const frame=data.frames[k],lat=frame.lattice||data.defaultLattice;
  return {"@module":"pymatgen.core.structure","@class":"Structure",charge:0,properties:{},
    lattice:Object.assign({matrix:lat,pbc:[true,true,true]},latParams(lat)),
    sites:frame.positions.map((abc,i)=>({species:[{element:data.species[i],occu:1}],abc,xyz:cart(lat,abc),
      label:data.species[i],properties:{}}))};
}
/* Build the next frame in a hidden buffer while the current one is on screen, then swap whole
   buffers so a WebGL remount never shows a white flash. */
async function buildBuffer(k){
  const structure=frameStructure(k);
  await loadMV(structure);
  const buffer=document.createElement('div');buffer.className='mvbuf';buffer.style.visibility='hidden';
  scene.appendChild(buffer);
  try{window.renderMatterViz(structure,buffer,mvProps)}catch(e){}
  for(let attempts=0;attempts<60;attempts++){
    const canvas=buffer.querySelector('canvas');
    if(canvas&&canvas.width>1&&canvas.height>1) break;
    await raf();
  }
  await raf();await raf();
  return buffer;
}
function retire(keep){
  [...scene.children].forEach(child=>{if(child!==keep){freeMV(child);child.remove()}});
}
async function showFrame(k){
  if(!data||busy) return;
  busy=true;
  try{
    let buffer=prepared&&prepared.index===k?prepared.node:null;
    prepared=null;
    if(!buffer) buffer=await buildBuffer(k);
    buffer.style.visibility='visible';buffer.style.zIndex='2';
    await raf();
    retire(buffer);
    const next=k+1<data.frames.length?k+1:0;
    if(data.frames.length>1){
      const node=await buildBuffer(next);
      node.style.zIndex='1';
      prepared={index:next,node};
    }
  }catch(e){}
  busy=false;
}
/* ---------- energy / force convergence chart (unchanged) ---------- */
function renderChart(){
  const frames=data.frames,eRef=[...frames].reverse().find(f=>finite(f.energy))?.energy??0,rawDe=frames.map(f=>finite(f.energy)?f.energy-eRef:null),rawPeak=Math.max(0,...rawDe.filter(finite)),useMeV=rawPeak<.01,de=rawDe.map(v=>finite(v)?v*(useMeV?1000:1):null),forces=frames.map(f=>finite(f.fmax)?+f.fmax:null);
  const rect=chart.getBoundingClientRect(),W=Math.max(320,Math.round(rect.width||520)),H=Math.max(220,Math.round(rect.height||300)),eMax=niceUpper(Math.max(0,...de.filter(finite))*1.08,useMeV?1:.1),fMax=Math.max(.055,niceUpper(Math.max(0,...forces.filter(finite))*1.08,.055)),m={l:60,r:54,t:14,b:42},x=i=>m.l+(frames.length<2?0:i/(frames.length-1))*(W-m.l-m.r),ye=v=>H-m.b-(Math.max(0,v)/eMax)*(H-m.t-m.b),yf=v=>H-m.b-(Math.max(0,v)/fMax)*(H-m.t-m.b);
  const poly=(vals,y)=>vals.map((v,i)=>finite(v)?`${x(i)},${y(v)}`:null).filter(Boolean).join(' '),ticks=[0,.25,.5,.75,1],efmt=v=>eMax<1?v.toFixed(2):eMax<10?v.toFixed(1):v.toFixed(0),ffmt=v=>fMax<.1?v.toFixed(3):v.toFixed(2);
  chart.setAttribute('viewBox',`0 0 ${W} ${H}`);chart.innerHTML=`
    <line x1="${m.l}" y1="${H-m.b}" x2="${W-m.r}" y2="${H-m.b}" stroke="#9aa8af"/><line x1="${m.l}" y1="${m.t}" x2="${m.l}" y2="${H-m.b}" stroke="#9aa8af"/><line x1="${W-m.r}" y1="${m.t}" x2="${W-m.r}" y2="${H-m.b}" stroke="#9aa8af"/>
    ${ticks.map(t=>`<text x="${m.l-8}" y="${ye(t*eMax)+4}" text-anchor="end" font-size="11" fill="#2877b8">${efmt(t*eMax)}</text><text x="${W-m.r+8}" y="${yf(t*fMax)+4}" font-size="11" fill="#238554">${ffmt(t*fMax)}</text>`).join('')}
    <text x="${W/2}" y="${H-10}" text-anchor="middle" font-size="12" fill="#17252d">Stored ionic frame</text><text x="15" y="${H/2}" text-anchor="middle" transform="rotate(-90 15 ${H/2})" font-size="11" fill="#2877b8">Energy change (${useMeV?'meV':'eV'})</text><text x="${W-12}" y="${H/2}" text-anchor="middle" transform="rotate(90 ${W-12} ${H/2})" font-size="11" fill="#238554">Maximum force (eV/Å)</text>
    <line x1="${m.l}" y1="${yf(.05)}" x2="${W-m.r}" y2="${yf(.05)}" stroke="#238554" stroke-dasharray="5 5" opacity=".75"/><text x="${m.l+7}" y="${yf(.05)-5}" font-size="10.5" fill="#238554">Force threshold 0.05 eV/Å</text>
    <polyline points="${poly(de,ye)}" fill="none" stroke="#2877b8" stroke-width="2.3"/><polyline points="${poly(forces,yf)}" fill="none" stroke="#238554" stroke-width="2.3"/>
    <g id="cursor"><line id="cursor-line" y1="${m.t}" y2="${H-m.b}" stroke="#4b5563" stroke-dasharray="4 4"/><circle id="e-dot" r="6" fill="#2877b8"/><circle id="f-dot" r="6" fill="#238554"/></g>`;
  data.chart={de,forces,x,ye,yf};updateChartCursor(index);
}
function updateChartCursor(i){const c=data.chart,x=c.x(i),e=finite(c.de[i])?c.de[i]:0,f=finite(c.forces[i])?c.forces[i]:0;chart.querySelector('#cursor-line').setAttribute('x1',x);chart.querySelector('#cursor-line').setAttribute('x2',x);chart.querySelector('#e-dot').setAttribute('cx',x);chart.querySelector('#e-dot').setAttribute('cy',c.ye(e));chart.querySelector('#f-dot').setAttribute('cx',x);chart.querySelector('#f-dot').setAttribute('cy',c.yf(f))}
function updateUI(i){i=Math.max(0,Math.min(data.frames.length-1,i));index=i;slider.value=i;count.textContent=`frame ${i+1} / ${data.frames.length}`;updateChartCursor(i);const f=data.frames[i],eRef=[...data.frames].reverse().find(x=>finite(x.energy))?.energy,delta=finite(f.energy)&&finite(eRef)?f.energy-eRef:null,deltaValue=deltaText(delta);document.getElementById('metrics').innerHTML=`<div class="metric"><small>Total energy</small><b>${finite(f.energy)?(+f.energy).toFixed(3)+' eV':'Unavailable'}</b></div><div class="metric"><small>Energy above final</small><b>${finite(delta)&&delta>0?'+':''}${deltaValue}</b></div><div class="metric"><small>Maximum atomic force</small><b>${finite(f.fmax)?(+f.fmax).toFixed(3)+' eV/Å':'Unavailable'}</b></div>`}
/* ---------- playback: one stored ionic frame per tick ---------- */
function stop(){if(timer)clearInterval(timer);timer=0;playing=false;if(playButton)playButton.textContent='▶ Play'}
function tick(){
  if(busy) return;
  const next=index>=data.frames.length-1?null:index+1;
  if(next===null){stop();return}
  updateUI(next);showFrame(next);
}
function play(){
  if(playing){stop();return}
  if(index>=data.frames.length-1){updateUI(0);showFrame(0)}
  playing=true;playButton.textContent='⏸ Pause';
  timer=setInterval(tick,duration);
}
/* An occluded tab freezes requestAnimationFrame, so a frame can be swapped in before WebGL has
   drawn it — the pane would read white on return. Hold playback while hidden and repaint on return. */
let resumeOnShow=false;
document.addEventListener('visibilitychange',()=>{
  if(!data) return;
  if(document.hidden){ if(playing){resumeOnShow=true;stop()} }
  else showFrame(index).then(()=>{if(resumeOnShow){resumeOnShow=false;play()}});
});
function mount(payload){
  stop();index=0;prepared=null;busy=false;
  if(chartObserver)chartObserver.disconnect();
  if(scene)retire(null);
  data=payload;
  mvProps=Object.assign({show_controls:false},defectSiteMark(payload));
  document.getElementById('app').innerHTML=`<div class="panel" id="scene-wrap"></div><div class="panel" id="analysis"><svg id="chart" aria-label="Energy and force convergence"></svg><div class="controls"><button id="play">▶ Play</button><input id="slider" type="range" min="0" max="${payload.frames.length-1}" value="0"><span id="count"></span></div><div id="metrics"></div></div>`;
  scene=document.getElementById('scene-wrap');chart=document.getElementById('chart');slider=document.getElementById('slider');count=document.getElementById('count');playButton=document.getElementById('play');
  playButton.onclick=play;slider.oninput=e=>{stop();const v=+e.target.value;updateUI(v);showFrame(v)};
  chartObserver=new ResizeObserver(()=>{if(data&&chart.clientWidth)renderChart()});chartObserver.observe(chart);
  renderChart();updateUI(0);showFrame(0).then(()=>{if(data.frames.length>1)play()});
}
addEventListener('message',event=>{if(event.origin===location.origin&&event.data&&event.data.type==='traj_frames'&&Array.isArray(event.data.frames))mount(event.data)});
parent.postMessage({type:'traj_ready'},location.origin);
</script></body></html>

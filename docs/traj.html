<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Continuous ionic-relaxation trajectory</title>
<style>
:root{--ink:#17252d;--muted:#62727c;--line:#d9e1e6;--blue:#2877b8;--green:#238554;--accent:#087f8c;--surface:#f7fafb}
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:var(--ink);font-family:'Arial Narrow',Arial,sans-serif}
#app{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(300px,.82fr);gap:8px;padding:8px}
.panel{min-width:0;min-height:0;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}
#scene-wrap{position:relative;background:linear-gradient(180deg,#fff,#f7fafb)}
#scene{display:block;width:100%;height:100%}.scene-label{display:none}
#legend{position:absolute;left:8px;right:8px;bottom:7px;display:flex;justify-content:center;gap:5px;flex-wrap:wrap;pointer-events:none}
.el{display:inline-flex;align-items:center;gap:4px;padding:2px 5px;border:1px solid var(--line);border-radius:4px;color:var(--ink);background:#fffffff0!important;font-size:10.5px}
.el::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--el-color);border:1px solid #0002}
#analysis{display:flex;flex-direction:column;padding:5px 6px 6px;border:0}
#chart{display:block;width:100%;flex:1;min-height:220px;overflow:visible}
.controls{display:grid;grid-template-columns:auto minmax(90px,1fr) auto;align-items:center;gap:8px;margin-top:4px}
button{font:inherit;font-weight:700;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);padding:6px 11px;cursor:pointer}button:hover{border-color:var(--accent);color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}#count{white-space:nowrap;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
#metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:7px;border-top:1px solid var(--line)}.metric{padding:6px 7px;min-width:0}.metric+.metric{border-left:1px solid var(--line)}.metric small{display:block;color:var(--muted);font-size:10.5px}.metric b{display:block;margin-top:1px;font-size:12.5px;white-space:nowrap}
.waiting{grid-column:1/-1;display:grid;place-items:center;color:var(--muted);font-size:14px}
@media(max-width:760px){#app{grid-template-columns:1fr;overflow:auto}.panel{min-height:300px}#analysis{min-height:330px}.metric b{white-space:normal}}
</style>
</head>
<body><div id="app"><div class="waiting">Loading relaxation trajectory…</div></div>
<script>
const COLORS={H:'#d9d9d9',S:'#d7cf36',Se:'#d17135',Te:'#9a6b4f',Na:'#8269d7',K:'#7c43bf',Rb:'#5d2b91',Cs:'#4f245e',Cu:'#3456a4',Ag:'#9b9b9b',Mg:'#df7b35',Ca:'#6a98ad',Sr:'#62a4a7',Ba:'#5c8ab0',Cd:'#7b8e99',Zn:'#65b953',Zr:'#36c75c',Sn:'#74808c',Ge:'#6e8195',Al:'#78a4c0',Ga:'#6d92ac',In:'#6b8296'};
const RADII={H:.55,S:1.0,Se:1.05,Te:1.12,Na:1.18,K:1.3,Rb:1.34,Cs:1.38,Cu:.88,Ag:1.02,Mg:.92,Ca:1.08,Sr:1.15,Ba:1.23,Cd:1.02,Zn:.94,Zr:1.04,Sn:1.05,Ge:.98,Al:.93,Ga:.95,In:1.02};
let data=null,index=0,playing=false,raf=0,segmentStart=0,playOrigin=0,duration=700,scene,ctx,chart,slider,count,playButton,sceneObserver,chartObserver;
const finite=v=>v!==null&&v!==undefined&&Number.isFinite(+v);
const niceUpper=(value,fallback)=>{if(!(value>0))return fallback;const power=10**Math.floor(Math.log10(value)),scaled=value/power,step=scaled<=1?1:scaled<=2?2:scaled<=2.5?2.5:scaled<=5?5:10;return step*power};
const deltaText=value=>!finite(value)?'Unavailable':Math.abs(value)<.01?`${(value*1000).toFixed(2)} meV`:`${value.toFixed(2)} eV`;
const cart=(lat,f)=>[f[0]*lat[0][0]+f[1]*lat[1][0]+f[2]*lat[2][0],f[0]*lat[0][1]+f[1]*lat[1][1]+f[2]*lat[2][1],f[0]*lat[0][2]+f[1]*lat[1][2]+f[2]*lat[2][2]];
const lerp=(a,b,t)=>a+(b-a)*t;
function interpolated(k,t){
  const a=data.frames[k],b=data.frames[Math.min(k+1,data.frames.length-1)],lat=a.lattice.map((row,i)=>row.map((v,j)=>lerp(v,b.lattice[i][j],t)));
  const positions=a.positions.map((p,i)=>p.map((v,j)=>{let d=b.positions[i][j]-v;d-=Math.round(d);return v+d*t;}));
  return {lat,positions};
}
function rotate(p){
  const yaw=-.62,pitch=.38,cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  const x=cy*p[0]+sy*p[2],z=-sy*p[0]+cy*p[2];return [x,cp*p[1]-sp*z,sp*p[1]+cp*z];
}
function sceneGeometry(frame){
  const raw=frame.positions.map(p=>rotate(cart(frame.lat,p))),center=[0,1,2].map(j=>raw.reduce((s,p)=>s+p[j],0)/raw.length);
  const pts=raw.map(p=>p.map((v,j)=>v-center[j]));
  const corners=[];for(let a=0;a<2;a++)for(let b=0;b<2;b++)for(let c=0;c<2;c++)corners.push(rotate(cart(frame.lat,[a,b,c])).map((v,j)=>v-center[j]));
  const extent=Math.max(...pts.flatMap(p=>[Math.abs(p[0]),Math.abs(p[1])]),...corners.flatMap(p=>[Math.abs(p[0]),Math.abs(p[1])]),1);
  const scale=.39*Math.min(scene.clientWidth,scene.clientHeight)/extent,ox=scene.clientWidth/2,oy=scene.clientHeight/2;
  const project=p=>[ox+p[0]*scale,oy-p[1]*scale,p[2]];
  return {pts:pts.map(project),corners:corners.map(project),scale};
}
function resizeCanvas(){const dpr=Math.min(devicePixelRatio||1,2),r=scene.getBoundingClientRect();scene.width=Math.max(1,Math.round(r.width*dpr));scene.height=Math.max(1,Math.round(r.height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);drawScene(index,0)}
function drawScene(k,t){
  if(!data||!scene.clientWidth)return;const frame=interpolated(k,t),g=sceneGeometry(frame);ctx.clearRect(0,0,scene.clientWidth,scene.clientHeight);
  const edgePairs=[[0,1],[0,2],[0,4],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7]];
  ctx.strokeStyle='#91a3ab70';ctx.lineWidth=.8;edgePairs.forEach(([a,b])=>{ctx.beginPath();ctx.moveTo(g.corners[a][0],g.corners[a][1]);ctx.lineTo(g.corners[b][0],g.corners[b][1]);ctx.stroke()});
  const bonds=[];if(frame.positions.length<=128)for(let i=0;i<frame.positions.length;i++)for(let j=i+1;j<frame.positions.length;j++){
    const raw=frame.positions[i].map((v,q)=>frame.positions[j][q]-v),d=raw.map(x=>x-Math.round(x));
    if(raw.some((x,q)=>Math.abs(x-d[q])>.2)) continue;
    const v=cart(frame.lat,d),dist=Math.hypot(...v),cut=1.2*((RADII[data.species[i]]||1)+(RADII[data.species[j]]||1));
    if(dist>1.15&&dist<Math.min(3.05,cut))bonds.push([i,j]);
  }
  ctx.strokeStyle='#82919955';ctx.lineWidth=.75;bonds.forEach(([i,j])=>{const a=g.pts[i],b=g.pts[j];ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()});
  const marked=new Set;for(const site of data.dsite||[]){let best=-1,bd=1e9;frame.positions.forEach((p,i)=>{const d=Math.hypot(...p.map((v,q)=>{let x=v-site[q];return x-Math.round(x)}));if(d<bd){bd=d;best=i}});if(best>=0&&bd<.18)marked.add(best)}
  [...g.pts.keys()].sort((a,b)=>g.pts[a][2]-g.pts[b][2]).forEach(i=>{const p=g.pts[i],el=data.species[i],markedSite=marked.has(i),baseRadius=Math.max(3.2,(RADII[el]||1)*g.scale*.105),r=markedSite?Math.max(5.5,baseRadius*1.2):baseRadius,base=markedSite?'#111820':(COLORS[el]||'#7f8c8d');ctx.beginPath();ctx.arc(p[0],p[1],r,0,Math.PI*2);ctx.fillStyle=base;ctx.fill();ctx.strokeStyle=markedSite?'#000':'#ffffffdd';ctx.lineWidth=markedSite?1.6:.8;ctx.stroke()});
}
function renderChart(){
  const frames=data.frames,eRef=[...frames].reverse().find(f=>finite(f.energy))?.energy??0,rawDe=frames.map(f=>finite(f.energy)?f.energy-eRef:null),rawPeak=Math.max(0,...rawDe.filter(finite)),useMeV=rawPeak<.01,de=rawDe.map(v=>finite(v)?v*(useMeV?1000:1):null),forces=frames.map(f=>finite(f.fmax)?+f.fmax:null);
  const rect=chart.getBoundingClientRect(),W=Math.max(320,Math.round(rect.width||520)),H=Math.max(250,Math.round(rect.height||320)),eMax=niceUpper(Math.max(0,...de.filter(finite))*1.08,useMeV?1:.1),fMax=Math.max(.055,niceUpper(Math.max(0,...forces.filter(finite))*1.08,.055)),m={l:64,r:58,t:18,b:48},x=i=>m.l+(frames.length<2?0:i/(frames.length-1))*(W-m.l-m.r),ye=v=>H-m.b-(Math.max(0,v)/eMax)*(H-m.t-m.b),yf=v=>H-m.b-(Math.max(0,v)/fMax)*(H-m.t-m.b);
  const poly=(vals,y)=>vals.map((v,i)=>finite(v)?`${x(i)},${y(v)}`:null).filter(Boolean).join(' '),ticks=[0,.25,.5,.75,1],efmt=v=>eMax<1?v.toFixed(2):eMax<10?v.toFixed(1):v.toFixed(0),ffmt=v=>fMax<.1?v.toFixed(3):v.toFixed(2);
  chart.setAttribute('viewBox',`0 0 ${W} ${H}`);chart.innerHTML=`
    <line x1="${m.l}" y1="${H-m.b}" x2="${W-m.r}" y2="${H-m.b}" stroke="#9aa8af"/><line x1="${m.l}" y1="${m.t}" x2="${m.l}" y2="${H-m.b}" stroke="#9aa8af"/><line x1="${W-m.r}" y1="${m.t}" x2="${W-m.r}" y2="${H-m.b}" stroke="#9aa8af"/>
    ${ticks.map(t=>`<text x="${m.l-8}" y="${ye(t*eMax)+4}" text-anchor="end" font-size="11" fill="#2877b8">${efmt(t*eMax)}</text><text x="${W-m.r+8}" y="${yf(t*fMax)+4}" font-size="11" fill="#238554">${ffmt(t*fMax)}</text>`).join('')}
    <text x="${W/2}" y="${H-12}" text-anchor="middle" font-size="12" fill="#17252d">Stored ionic frame</text><text x="17" y="${H/2}" text-anchor="middle" transform="rotate(-90 17 ${H/2})" font-size="11" fill="#2877b8">Energy change (${useMeV?'meV':'eV'})</text><text x="${W-14}" y="${H/2}" text-anchor="middle" transform="rotate(90 ${W-14} ${H/2})" font-size="11" fill="#238554">Maximum force (eV/Å)</text>
    <line x1="${m.l}" y1="${yf(.05)}" x2="${W-m.r}" y2="${yf(.05)}" stroke="#238554" stroke-dasharray="5 5" opacity=".75"/><text x="${m.l+7}" y="${yf(.05)-5}" font-size="10.5" fill="#238554">Force threshold 0.05 eV/Å</text>
    <polyline points="${poly(de,ye)}" fill="none" stroke="#2877b8" stroke-width="2.3"/><polyline points="${poly(forces,yf)}" fill="none" stroke="#238554" stroke-width="2.3"/>
    <g id="cursor"><line id="cursor-line" y1="${m.t}" y2="${H-m.b}" stroke="#4b5563" stroke-dasharray="4 4"/><circle id="e-dot" r="6" fill="#2877b8"/><circle id="f-dot" r="6" fill="#238554"/></g>`;
  data.chart={de,forces,x,ye,yf};updateChartCursor(index);
}
function updateChartCursor(i){const c=data.chart,x=c.x(i),e=finite(c.de[i])?c.de[i]:0,f=finite(c.forces[i])?c.forces[i]:0;chart.querySelector('#cursor-line').setAttribute('x1',x);chart.querySelector('#cursor-line').setAttribute('x2',x);chart.querySelector('#e-dot').setAttribute('cx',x);chart.querySelector('#e-dot').setAttribute('cy',c.ye(e));chart.querySelector('#f-dot').setAttribute('cx',x);chart.querySelector('#f-dot').setAttribute('cy',c.yf(f))}
function updateUI(i){i=Math.max(0,Math.min(data.frames.length-1,i));index=i;slider.value=i;count.textContent=`frame ${i+1} / ${data.frames.length}`;updateChartCursor(i);const f=data.frames[i],eRef=[...data.frames].reverse().find(x=>finite(x.energy))?.energy,delta=finite(f.energy)&&finite(eRef)?f.energy-eRef:null,deltaValue=deltaText(delta);document.getElementById('metrics').innerHTML=`<div class="metric"><small>Total energy</small><b>${finite(f.energy)?(+f.energy).toFixed(3)+' eV':'Unavailable'}</b></div><div class="metric"><small>Energy above final</small><b>${finite(delta)&&delta>0?'+':''}${deltaValue}</b></div><div class="metric"><small>Maximum atomic force</small><b>${finite(f.fmax)?(+f.fmax).toFixed(3)+' eV/Å':'Unavailable'}</b></div>`}
function stop(){cancelAnimationFrame(raf);raf=0;playing=false;playButton.textContent='▶ Play';drawScene(index,0)}
function animate(now){if(!playing)return;const elapsed=Math.max(0,now-segmentStart),seg=playOrigin+Math.floor(elapsed/duration),fraction=(elapsed%duration)/duration;if(seg>=data.frames.length-1){updateUI(data.frames.length-1);drawScene(data.frames.length-1,0);stop();return}if(seg!==index)updateUI(seg);drawScene(seg,fraction);raf=requestAnimationFrame(animate)}
function play(){if(playing){stop();return}if(index>=data.frames.length-1)updateUI(0);playing=true;playOrigin=index;playButton.textContent='⏸ Pause';segmentStart=performance.now();raf=requestAnimationFrame(animate)}
function mount(payload){
  cancelAnimationFrame(raf);raf=0;playing=false;index=0;if(sceneObserver)sceneObserver.disconnect();if(chartObserver)chartObserver.disconnect();
  data=payload;document.getElementById('app').innerHTML=`<div class="panel" id="scene-wrap"><canvas id="scene"></canvas><div id="legend"></div></div><div class="panel" id="analysis"><svg id="chart" aria-label="Energy and force convergence"></svg><div class="controls"><button id="play">▶ Play</button><input id="slider" type="range" min="0" max="${payload.frames.length-1}" value="0"><span id="count"></span></div><div id="metrics"></div></div>`;
  scene=document.getElementById('scene');ctx=scene.getContext('2d');chart=document.getElementById('chart');slider=document.getElementById('slider');count=document.getElementById('count');playButton=document.getElementById('play');
  [...new Set(data.species)].forEach(el=>{const s=document.createElement('span');s.className='el';s.textContent=el;s.style.setProperty('--el-color',COLORS[el]||'#7f8c8d');document.getElementById('legend').appendChild(s)});
  playButton.onclick=play;slider.oninput=e=>{stop();updateUI(+e.target.value);drawScene(+e.target.value,0)};sceneObserver=new ResizeObserver(resizeCanvas);sceneObserver.observe(scene);chartObserver=new ResizeObserver(()=>{if(data&&chart.clientWidth)renderChart()});chartObserver.observe(chart);renderChart();updateUI(0);resizeCanvas();play();
}
addEventListener('message',event=>{if(event.origin===location.origin&&event.data&&event.data.type==='traj_frames'&&Array.isArray(event.data.frames))mount(event.data)});
parent.postMessage({type:'traj_ready'},location.origin);
</script></body></html>
